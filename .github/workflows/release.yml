name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - rid: linux-arm64
            os: ubuntu-latest
            archive: tar.gz
          - rid: osx-x64
            os: macos-latest
            archive: tar.gz
          - rid: osx-arm64
            os: macos-latest
            archive: tar.gz
          - rid: win-x64
            os: windows-latest
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file binary
        run: >
          dotnet publish YSharp.Compiler
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish/${{ matrix.rid }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd publish/${{ matrix.rid }}
          tar -czf ../../ysc-${{ matrix.rid }}.tar.gz ysc

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/${{ matrix.rid }}/ysc.exe -DestinationPath ysc-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ysc-${{ matrix.rid }}
          path: ysc-${{ matrix.rid }}.*

  publish-lsp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - rid: linux-arm64
            os: ubuntu-latest
            archive: tar.gz
          - rid: osx-x64
            os: macos-latest
            archive: tar.gz
          - rid: osx-arm64
            os: macos-latest
            archive: tar.gz
          - rid: win-x64
            os: windows-latest
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The LSP can't be AOT (OmniSharp's protocol stack uses reflection);
      # ship it as a self-contained single-file JIT binary instead.
      - name: Publish single-file LSP binary
        run: >
          dotnet publish YSharp.LanguageServer
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish-lsp/${{ matrix.rid }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd publish-lsp/${{ matrix.rid }}
          tar -czf ../../ysharp-lsp-${{ matrix.rid }}.tar.gz ysharp-lsp

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path publish-lsp/${{ matrix.rid }}/ysharp-lsp.exe -DestinationPath ysharp-lsp-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ysharp-lsp-${{ matrix.rid }}
          path: ysharp-lsp-${{ matrix.rid }}.*

  nuget:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack YSharp.Core (stable)
        run: >
          dotnet pack YSharp.Core
          --configuration Release
          -p:Version=${GITHUB_REF_NAME#v}
          -o packages

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "packages/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

  release:
    needs: [publish, publish-lsp, nuget]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber artifacts/*
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              artifacts/*
          fi
