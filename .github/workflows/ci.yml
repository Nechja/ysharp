name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run Test
        run: dotnet run --project Test --configuration Release --no-build

      - name: LSP smoke test
        run: python3 scripts/lsp-smoke.py dotnet YSharp.LanguageServer/bin/Release/net10.0/ysharp-lsp.dll

  publish-prerelease:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack YSharp.Core (prerelease)
        run: >
          dotnet pack YSharp.Core
          --configuration Release
          --version-suffix preview.${{ github.run_number }}
          -o packages

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "packages/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
